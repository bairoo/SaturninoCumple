<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saturnino cumple 1 año</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;600;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 20%, #16161f, #0a0a0f 70%);
    font-family: 'Poppins', sans-serif;
    color: #f4f2ff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    position: relative;
    overflow-x: hidden;
  }
  .halo { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.35; pointer-events: none; }
  .float1 { animation: float1 6s ease-in-out infinite; }
  .float2 { animation: float2 7s ease-in-out infinite; }
  @keyframes float1 { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
  @keyframes float2 { 0%,100% { transform: translateY(0) rotate(2deg) scale(1); } 50% { transform: translateY(10px) rotate(-2deg) scale(1.03); } }
  .grad-btn { background: linear-gradient(120deg, #ff2e88, #8b5cf6, #00e5ff); background-size: 200% 200%; animation: gradShift 5s ease infinite; }
  @keyframes gradShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  button:focus, input:focus { outline: 3px solid #00e5ff; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .float1, .float2, .grad-btn { animation: none !important; } }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: rgba(18,18,26,0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 32px 24px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
  }
  .badge-img {
    width: clamp(110px, 30vw, 150px);
    height: auto;
    margin: 0 auto;
    display: block;
    filter: drop-shadow(0 0 26px rgba(255,46,136,0.55));
  }
  .title-img {
    width: clamp(240px, 78vw, 340px);
    height: auto;
    margin: 8px auto 4px;
    display: block;
    filter: drop-shadow(0 0 22px rgba(0,229,255,0.35));
  }
  .eyebrow { font-size: 13px; letter-spacing: 3px; color: #b9b3d9; margin: 0 0 24px; font-weight: 600; }
  .info-date { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .info-sub { font-size: 15px; color: #c9c4e8; margin: 0; }
  .countdown { font-size: 14px; color: #8ee8ff; margin: 16px 0 24px; }
  .deadline-closed { font-size: 14px; color: #e0a; margin: 0 0 8px; line-height: 1.5; }
  .limit-note { font-size: 12px; color: #8a84ad; margin-top: 10px; }
  .cta {
    border: none; color: #0a0a0f; font-weight: 700; font-size: 16px;
    padding: 14px 28px; border-radius: 999px; cursor: pointer; width: 100%;
    box-shadow: 0 0 30px rgba(139,92,246,0.4);
  }
  .form-title { font-family: 'Bungee', cursive; font-size: 22px; margin: 0 0 6px; text-align: center; }
  .form-sub { font-size: 13px; color: #b9b3d9; margin: 0 0 20px; text-align: center; line-height: 1.5; }
  .label { display: block; font-size: 13px; margin-bottom: 6px; color: #c9c4e8; text-align: left; }
  .input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05);
    color: #fff; font-size: 15px; margin-bottom: 18px;
  }
  .counter-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .counter-box {
    flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 12px; text-align: center;
  }
  .counter-label { font-size: 12px; color: #b9b3d9; display: block; margin-bottom: 8px; }
  .counter-controls { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .counter-btn {
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 18px; cursor: pointer;
  }
  .counter-value { font-size: 18px; font-weight: 700; min-width: 20px; display: inline-block; }
  .error-text { color: #ff6b9c; font-size: 13px; margin-bottom: 12px; }
  .back-link { background: none; border: none; color: #8ee8ff; font-size: 13px; cursor: pointer; padding: 0; margin-bottom: 16px; display: block; text-align: left; }
  .check-badge {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, #ff2e88, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 700; margin: 0 auto 16px;
    box-shadow: 0 0 30px rgba(255,46,136,0.5);
  }
  .done-summary { font-size: 15px; line-height: 1.6; margin: 0 0 8px; }
  .hidden { display: none; }
</style>
</head>

    <button type="button" class="grad-btn cta" id="btn-confirmar" onclick="confirmarAsistencia()">Confirmar</button>
  </div>

  <!-- Vista: gracias -->
  <div id="view-done" class="hidden">
    <div class="check-badge float2">✓</div>
    <h2 class="form-title" id="done-title">¡Gracias!</h2>
    <p class="done-summary" id="done-summary"></p>
    <p class="limit-note">Nos vemos el 17 DE SEPTIEMBRE en Fresas Multievento 🎉</p>
  </div>

</div>

<script>
  var EVENTO = {
    fechaISO: "2026-09-17T18:00:00",
    limiteISO: "2026-09-05T23:59:59",
    limiteLabel: "5 de septiembre",
    webAppUrl: "https://script.google.com/macros/s/AKfycbwxTN-0enNHObsJGs_C0rUs8iWEtYp3OpJE3QsCBS8tRoJEAvcFbbe193tKDRmtcjY/exec"
  };

  var contadores = { mayores: 2, menores: 0 };

  function cambiarContador(campo, delta) {
    contadores[campo] = Math.max(0, contadores[campo] + delta);
    document.getElementById(campo + "-value").textContent = contadores[campo];
  }

  function mostrarVista(nombre) {
    ["invite", "form", "done"].forEach(function(v) {
      document.getElementById("view-" + v).classList.toggle("hidden", v !== nombre);
    });
  }

  function actualizarCountdown() {
    var ahora = new Date();
    var evento = new Date(EVENTO.fechaISO);
    var limite = new Date(EVENTO.limiteISO);
    var diff = evento - ahora;
    var el = document.getElementById("countdown-text");
    if (diff > 0) {
      var dias = Math.floor(diff / (1000 * 60 * 60 * 24));
      var horas = Math.floor((diff / (1000 * 60 * 60)) % 24);
      el.innerHTML = "Faltan <strong>" + dias + "</strong> días y <strong>" + horas + "</strong> hs";
    } else {
      el.textContent = "¡Es hoy o ya pasó! 🎉";
    }

    var ctaArea = document.getElementById("cta-area");
    if (ahora > limite) {
      ctaArea.innerHTML = '<p class="deadline-closed">El plazo para confirmar (hasta el ' + EVENTO.limiteLabel + ') ya cerró. Escribile a la familia si igual querés avisar tu asistencia.</p>';
    } else {
      ctaArea.innerHTML = '<button type="button" class="grad-btn cta" onclick="mostrarVista(\'form\')">Confirmar asistencia</button><p class="limit-note">Confirmá antes del ' + EVENTO.limiteLabel + '</p>';
    }
  }

  function confirmarAsistencia() {
    var nombre = document.getElementById("nombre").value.trim().slice(0, 60);
    var mayores = contadores.mayores;
    var menores = contadores.menores;
    var errorEl = document.getElementById("error-text");

    if (!nombre) {
      errorEl.textContent = "Poné tu nombre o el de tu familia.";
      errorEl.classList.remove("hidden");
      return;
    }
    if (mayores < 1 && menores < 1) {
      errorEl.textContent = "Tiene que haber al menos un invitado.";
      errorEl.classList.remove("hidden");
      return;
    }
    errorEl.classList.add("hidden");

    var btn = document.getElementById("btn-confirmar");
    btn.disabled = true;
    btn.textContent = "Enviando...";

    var params = new URLSearchParams({ nombre: nombre, mayores: mayores, menores: menores });
    fetch(EVENTO.webAppUrl + "?" + params.toString(), { method: "GET", mode: "no-cors" })
      .then(function() {
        mostrarGracias(nombre, mayores, menores);
      })
      .catch(function() {
        mostrarGracias(nombre, mayores, menores);
      });
  }

  function mostrarGracias(nombre, mayores, menores) {
    document.getElementById("done-title").textContent = "¡Gracias, " + nombre + "!";
    document.getElementById("done-summary").innerHTML =
      "Confirmaste <strong>" + mayores + "</strong> mayor" + (mayores !== 1 ? "es" : "") +
      " y <strong>" + menores + "</strong> menor" + (menores !== 1 ? "es" : "") + ".";
    mostrarVista("done");
  }

  actualizarCountdown();
  setInterval(actualizarCountdown, 30000);
</script>

</body>
</html>
